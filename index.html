<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A Story for You</title>
    <style>
        body {
            background: linear-gradient(to bottom, #87CEEB, #ffffff);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; font-family: 'Georgia', serif;
        }
        .book-gate {
            width: 300px; padding: 40px; background: rgba(255, 255, 255, 0.9); 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;
        }
        button {
            margin-top: 20px; padding: 12px 30px; background: #ffb7c5; 
            border: none; cursor: pointer; border-radius: 25px; color: white; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="book-gate">
        <h1>Welcome</h1>
        <p>A special story, just for you. Please enter the code.</p>
        <button onclick="checkPassword()">Unlock Story</button>
    </div>

    <script>
        function checkPassword() {
            const code = prompt("Enter the secret code:");
            if (code === "1234") {
                window.location.href = "book.html";
            } else {
                alert("Incorrect code!");
            }
        }
    </script>
</body>
</html>
