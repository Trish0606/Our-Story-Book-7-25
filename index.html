<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>A Story for You</title>
    <style>
        body {
            background: linear-gradient(135deg, #e6f3ff, #ffe6f0);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
            font-family: 'Georgia', serif; color: #333; overflow: hidden;
        }
        .tree { position: fixed; bottom: 0; font-size: 200px; line-height: 1; z-index: 0; pointer-events: none; }
        .gate { width: 320px; padding: 40px; background: rgba(255, 255, 255, 0.9); border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 2px solid #ffcce6; z-index: 10; }
    </style>
</head>
<body>

    <div class="tree" style="left: -20px;">🌸</div>
    <div class="tree" style="right: -20px;">🌸</div>

    <div class="gate">
        <h1 style="color: #d63384; font-style: italic;">Welcome</h1>
        <p style="color: #4a90e2; font-weight: bold;">Please enter the secret code.</p>
        <button onclick="checkPassword()" style="padding: 12px 30px; background: #4a90e2; border: none; cursor: pointer; border-radius: 25px; color: white; font-weight: bold;">Unlock Story</button>
    </div>

    <script>
        function checkPassword() {
            const code = prompt("Enter the secret code:");
            if (code === "1234") {
                window.location.href = "book.html";
            } else {
                alert("Incorrect code!");
            }
        }
    </script>
</body>
</html>
