<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>A Story for You</title>
</head>
<body style="background: linear-gradient(135deg, #e6f3ff, #ffe6f0) !important; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; font-family: 'Georgia', serif; color: #333;">

    <div style="width: 320px; padding: 40px; background: rgba(255, 255, 255, 0.85); border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; border: 2px solid #ffcce6;">
        <div style="font-size: 40px; margin-bottom: 10px;">🌸 🌼 🌸</div>
        
        <h1 style="color: #d63384; margin: 10px 0; font-style: italic;">Happy 8th!</h1>
        <p style="color: #4a90e2; font-weight: bold;">A special story, blooming for you.</p>
        
        <button onclick="checkPassword()" style="margin-top: 25px; padding: 12px 30px; background: #4a90e2; border: none; cursor: pointer; border-radius: 25px; color: white; font-weight: bold; font-family: 'Georgia', serif; font-size: 16px; transition: background 0.3s;">Unlock Story</button>
    </div>

    <script>
        function checkPassword() {
            const code = prompt("Enter the secret code:");
            if (code === "1234") {
                window.location.href = "book.html";
            } else {
                alert("Incorrect code!");
            }
        }
    </script>
</body>
</html>
