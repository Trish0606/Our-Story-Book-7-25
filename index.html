<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A Story for You</title>
</head>
<body style="background: linear-gradient(to bottom, #87CEEB, #ffffff) !important; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; font-family: 'Georgia', serif;">

    <div style="width: 300px; padding: 40px; background: rgba(255, 255, 255, 0.9); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center;">
        <h1 style="color: #333;">Welcome</h1>
        <p>A special story, just for you.</p>
        <button onclick="checkPassword()" style="margin-top: 20px; padding: 12px 30px; background: #ffb7c5; border: none; cursor: pointer; border-radius: 25px; color: white; font-weight: bold;">Unlock Story</button>
    </div>

    <script>
        function checkPassword() {
            const code = prompt("Enter the secret code:");
            if (code === "1234") {
                window.location.href = "book.html";
            } else {
                alert("Incorrect code!");
            }
        }
    </script>
</body>
</html>
