<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>Our Story</title>
    <style>
        body {
            background: linear-gradient(135deg, #e6f3ff, #ffe6f0);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
            font-family: 'Georgia', serif; color: #333; overflow: hidden;
        }
        
        /* Petal Animation */
        .petal { position: absolute; top: -10%; font-size: 20px; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        
        /* Side Trees */
        .tree { position: fixed; bottom: 0; font-size: 200px; line-height: 1; z-index: 0; pointer-events: none; }
        
        /* The Book Stack */
        .book { width: 350px; height: 450px; position: relative; z-index: 10; }
        .page { 
            position: absolute; width: 100%; height: 100%; background: white; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; 
            transform-origin: left; transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1.000); 
            backface-visibility: hidden; border: 2px solid #ffcce6;
        }
        .flipped { transform: rotateY(-180deg); }
        
        img { max-width: 100%; border-radius: 10px; margin-top: 15px; border: 2px solid #ffe6f0; }
        button { margin-top: 25px; padding: 12px 25px; background: #ffb7c5; border: none; border-radius: 25px; color: white; cursor: pointer; font-family: 'Georgia', serif; font-weight: bold; }
        
        /* Ending Video */
        #final-screen { display: none; width: 350px; text-align: center; z-index: 20; }
        video { width: 100%; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="tree" style="left: -20px;">🌸</div>
    <div class="tree" style="right: -20px;">🌸</div>

    <div class="book" id="book">
        <div class="page" id="p1" style="z-index: 3;">
            <h2 style="color: #d63384;">Our Journey</h2>
            <p>Welcome to our special story.</p>
            <button onclick="nextPage('p1')">Turn Page →</button>
        </div>
        <div class="page" id="p2" style="z-index: 2;">
            <h2 style="color: #d63384;">A Special Memory</h2>
            <img src="memory.png" alt="Our memory">
            <button onclick="nextPage('p2')">Next →</button>
        </div>
        <div class="page" id="p3" style="z-index: 1;">
            <h2 style="color: #d63384;">Thank You!</h2>
            <p>Thank you for being part of this journey.</p>
            <button onclick="finishBook()">The End</button>
        </div>
    </div>

    <div id="final-screen">
        <video autoplay loop muted playsinline>
            <source src="ending.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // Petal Logic
        function createPetal() {
            const petal = document.createElement('div');
            petal.innerHTML = '🌸';
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            petal.style.opacity = Math.random();
            document.body.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 1000);

        function nextPage(id) {
            document.getElementById(id).classList.add('flipped');
        }

        function finishBook() {
            document.getElementById('book').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
        }
    </script>
</body>
</html>
