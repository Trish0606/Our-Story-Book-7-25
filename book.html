<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>Our Story</title>
    <style>
        body {
            background: linear-gradient(135deg, #e6f3ff, #ffe6f0);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
            font-family: 'Georgia', serif;
        }
        /* The Book Container */
        .book-container {
            width: 350px; height: 450px; position: relative;
            transform-style: preserve-3d; 
            /* This "cubic-bezier" makes it feel heavy and smooth instead of snappy */
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1.000);
        }
        
        /* This adds the "Pop" effect */
        .flipped { 
            transform: rotateY(-180deg) scale(1.05); 
        }

        .page {
            position: absolute; width: 100%; height: 100%;
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); /* Deeper shadow for 3D feel */
            text-align: center; backface-visibility: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .back-page { 
            transform: rotateY(180deg); background: #fffaf0; 
        }
        
        button { 
            margin-top: 25px; padding: 12px 25px; background: #ffb7c5; 
            border: none; border-radius: 25px; color: white; cursor: pointer;
            transition: transform 0.2s; font-family: 'Georgia', serif;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="book-container" id="book">
        <div class="page">
            <h2 style="color: #d63384;">Our Journey</h2>
            <p>This is the first page of our story.</p>
            <button onclick="flipPage()">Next Chapter →</button>
        </div>

        <div class="page back-page">
            <h2 style="color: #d63384;">The Pop-Up Chapter</h2>
            <p>I love how this story is unfolding.</p>
            <button onclick="window.location.href='index.html'">Back Home</button>
        </div>
    </div>

    <script>
        function flipPage() {
            // This triggers the CSS flip AND the scale "pop"
            document.getElementById('book').classList.add('flipped');
        }
    </script>
</body>
</html>
