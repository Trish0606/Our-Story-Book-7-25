<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>Our Story</title>
    <style>
        body {
            background: linear-gradient(135deg, #e6f3ff, #ffe6f0);
            height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; 
            font-family: 'Georgia', serif; perspective: 1500px;
        }

        /* The book spine/container */
        .book {
            width: 350px; height: 450px; position: relative;
            background: white; border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* The page that turns */
        .page-front {
            position: absolute; width: 100%; height: 100%;
            background: white; border-radius: 10px;
            z-index: 2; display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            /* MAGIC: Move the hinge to the left side */
            transform-origin: left; 
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1.000);
            backface-visibility: hidden;
            border: 1px solid #eee;
        }

        /* What's underneath */
        .page-back {
            position: absolute; width: 100%; height: 100%;
            background: #fffaf0; border-radius: 10px;
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center;
            z-index: 1;
        }

        /* Trigger the flip */
        .flipped { transform: rotateY(-180deg); }

        button { 
            margin-top: 25px; padding: 12px 25px; background: #ffb7c5; 
            border: none; border-radius: 25px; color: white; cursor: pointer;
            transition: transform 0.2s; font-family: 'Georgia', serif;
        }
    </style>
</head>
<body>

    <div class="book">
        <div class="page-back">
            <h2 style="color: #d63384;">Next Chapter</h2>
            <p>I love how this story is unfolding.</p>
            <button onclick="window.location.href='index.html'">Back Home</button>
        </div>

        <div class="page-front" id="turning-page">
            <h2 style="color: #d63384;">Our Journey</h2>
            <p>This is the first page of our story.</p>
            <button onclick="flipPage()">Turn Page →</button>
        </div>
    </div>

    <script>
        function flipPage() {
            document.getElementById('turning-page').classList.add('flipped');
        }
    </script>
</body>
</html>
