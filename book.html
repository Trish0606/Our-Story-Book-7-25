<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light">
    <title>Our Story</title>
    <style>
        body { background: linear-gradient(135deg, #e6f3ff, #ffe6f0); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; font-family: 'Georgia', serif; }
        .book { width: 350px; height: 450px; position: relative; }
        .page { position: absolute; width: 100%; height: 100%; background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform-origin: left; transition: transform 1s cubic-bezier(0.6, 0.05, 0.4, 0.95); backface-visibility: hidden; z-index: 10; }
        .flipped { transform: rotateY(-180deg); }
        img { max-width: 100%; border-radius: 10px; margin-top: 15px; }
        
        /* The Ending Screen */
        #final-screen { display: none; width: 350px; text-align: center; }
        video { width: 100%; border-radius: 15px; }
    </style>
</head>
<body>

    <div class="book" id="book">
        <div class="page" id="p1" style="z-index: 3;">
            <h2>Our Journey</h2>
            <p>Welcome to our story.</p>
            <button onclick="nextPage('p1')">Next</button>
        </div>
        <div class="page" id="p2" style="z-index: 2;">
            <h2>A Special Memory</h2>
            <img src="memory.png" alt="Our memory">
            <button onclick="nextPage('p2')">Next</button>
        </div>
        <div class="page" id="p3" style="z-index: 1;">
            <h2>Thank You!</h2>
            <p>Thank you for being part of this journey.</p>
            <button onclick="finishBook()">The End</button>
        </div>
    </div>

    <div id="final-screen">
        <video autoplay loop muted playsinline>
            <source src="ending.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        function nextPage(id) {
            document.getElementById(id).classList.add('flipped');
        }

        function finishBook() {
            // Hide the book, show the video
            document.getElementById('book').style.display = 'none';
            document.getElementById('final-screen').style.display = 'block';
        }
    </script>
</body>
</html>
